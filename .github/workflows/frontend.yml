name: Frontend CI

on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string
      storybook-deploy:
        required: false
        type: boolean
        default: true
      working-directory:
        required: false
        type: string
        default: frontend

jobs:
  code-analysis:
    name: "Frontend: Codeanalysis"
    uses: plone/meta/.github/workflows/frontend-code.yml@2.x
    with:
      node-version: ${{ inputs.node-version }}
      working-directory: ${{ inputs.working-directory }}

  i18n:
    name: "Frontend: i18n"
    uses: plone/meta/.github/workflows/frontend-i18n.yml@2.x
    with:
      node-version: ${{ inputs.node-version }}
      working-directory: ${{ inputs.working-directory }}

  unit:
    name: "Frontend: Unit tests"
    uses: plone/meta/.github/workflows/frontend-unit.yml@2.x
    with:
      node-version: ${{ inputs.node-version }}
      working-directory: ${{ inputs.working-directory }}

  acceptance:
    name: "Frontend: Acceptance tests"
    runs-on: ubuntu-latest
    needs:
      - unit
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # The backend supports Python 3.11 to 3.13.
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install the backend
        working-directory: backend
        run: make install

      - name: Install the frontend
        run: make install

      - name: Start the backend
        run: |
          make ci-acceptance-backend-start > ../backend-acceptance.log 2>&1 &
          npx --yes wait-on --timeout 180000 http-get://127.0.0.1:55001/plone

      - name: Start the frontend
        run: |
          make acceptance-frontend-prod-start > ../frontend-acceptance.log 2>&1 &
          npx --yes wait-on --timeout 600000 http-get://127.0.0.1:3000

      - name: Run Cypress
        run: make ci-acceptance-test

      - name: Upload Cypress artifacts and server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress
          path: |
            ${{ inputs.working-directory }}/core/packages/volto/cypress/screenshots
            ${{ inputs.working-directory }}/core/packages/volto/cypress/videos
            backend-acceptance.log
            frontend-acceptance.log

  storybook:
    name: "Storybook"
    uses: plone/meta/.github/workflows/frontend-storybook.yml@2.x
    needs:
      - code-analysis
      - unit
      - i18n
    with:
      node-version: ${{ inputs.node-version }}
      working-directory: ${{ inputs.working-directory }}
      deploy: ${{ inputs.storybook-deploy }}
    permissions:
      contents: write


  report:
    name: "Final report"
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - code-analysis
      - i18n
      - unit
      - acceptance
      - storybook
    steps:
      - name: Write report
        run: |
          echo '# Workflow Report' >> $GITHUB_STEP_SUMMARY
          echo '| Job ID | Conclusion |' >> $GITHUB_STEP_SUMMARY
          echo '| --- | --- |' >> $GITHUB_STEP_SUMMARY
          echo '| code-analysis | ${{ needs.code-analysis.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| i18n | ${{ needs.i18n.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| unit | ${{ needs.unit.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| acceptance | ${{ needs.acceptance.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| storybook | ${{ needs.storybook.result }} |' >> $GITHUB_STEP_SUMMARY
